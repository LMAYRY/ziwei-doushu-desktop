<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>紫微斗数</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: #f4efe4; color: #3b2f22;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      -webkit-user-select: none; user-select: none;
    }
    h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: 0.4em; padding-left: 0.4em; }
    p { margin: 0; font-size: 14px; color: #8a7a64; letter-spacing: 0.1em; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #9c3b2b; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.2; } }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1b16; color: #e8dcc7; }
      p { color: #a89880; }
    }
  </style>
</head>
<body>
  <h1>紫微斗数</h1>
  <div class="dot"></div>
  <p>正在启动…</p>
</body>
</html>
